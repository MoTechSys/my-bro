name: validate
on:
  push:
    branches: [main, genspark_ai_developer]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-09-11
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, resolved 2026-09-11
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install XML validator
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - name: Validate configuration, syntax and local regressions
        run: bash scripts/validate/validate_all.sh
