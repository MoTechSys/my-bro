<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1460" width="1160" height="1460" role="img" aria-labelledby="title description" font-family="DejaVu Sans Mono, monospace"><title id="title">Iterative research and acceptance workflow</title><desc id="description">مراحل البحث والتطوير. الانتقال مرهون بأدلة المرحلة؛ فشل التحقق يعيد العمل إلى التصميم أو التنفيذ. وجود الأداة أو الرسم لا يعني اجتياز القبول. Design / workflow; not evidence that every stage has passed</desc><rect width="1160" height="1460" fill="#ffffff" /><rect width="1160" height="124" fill="#102b45" /><text x="35" y="43" font-size="14" text-anchor="start" fill="#93d6dd">FIG01_METHODOLOGY</text><text x="35" y="76" font-size="22" text-anchor="start" fill="#ffffff">Iterative research and acceptance workflow</text><text x="35" y="105" font-size="14" text-anchor="start" fill="#dbe8f3">Design / workflow; not evidence that every stage has passed</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#366581" /></marker></defs><polyline points="580,270 580,350" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="580,450 580,530" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="580,630 580,710" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="580,810 580,890" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="580,990 580,1070" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="580,1170 580,1250" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="430,760 190,760 190,580 430,580" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><rect x="430" y="170" width="300" height="100" rx="22" fill="#eaf3ff" stroke="#45657b" stroke-width="1.5" /><text x="442" y="187" font-size="10" text-anchor="start" fill="#476273">PROCESS</text><text x="580" y="212" font-size="15" text-anchor="middle" fill="#19324b">Requirements</text><text x="580" y="232" font-size="15" text-anchor="middle" fill="#19324b">and source audit</text><rect x="430" y="350" width="300" height="100" rx="22" fill="#eaf3ff" stroke="#45657b" stroke-width="1.5" /><text x="442" y="367" font-size="10" text-anchor="start" fill="#476273">PROCESS</text><text x="580" y="392" font-size="15" text-anchor="middle" fill="#19324b">Tool selection</text><text x="580" y="412" font-size="15" text-anchor="middle" fill="#19324b">and scope decisions</text><rect x="430" y="530" width="300" height="100" rx="22" fill="#eaf3ff" stroke="#45657b" stroke-width="1.5" /><text x="442" y="547" font-size="10" text-anchor="start" fill="#476273">PROCESS</text><text x="580" y="572" font-size="15" text-anchor="middle" fill="#19324b">Architecture</text><text x="580" y="592" font-size="15" text-anchor="middle" fill="#19324b">and data contracts</text><rect x="430" y="710" width="300" height="100" rx="22" fill="#eaf3ff" stroke="#45657b" stroke-width="1.5" /><text x="442" y="727" font-size="10" text-anchor="start" fill="#476273">PROCESS</text><text x="580" y="752" font-size="15" text-anchor="middle" fill="#19324b">Implementation</text><text x="580" y="772" font-size="15" text-anchor="middle" fill="#19324b">and local regression tests</text><rect x="430" y="890" width="300" height="100" rx="4" fill="#f3edf9" stroke="#45657b" stroke-width="1.5" /><text x="442" y="907" font-size="10" text-anchor="start" fill="#476273">PENDING</text><text x="580" y="932" font-size="15" text-anchor="middle" fill="#19324b">Authorized native pilot</text><text x="580" y="952" font-size="15" text-anchor="middle" fill="#19324b">PILOT: 5 per scenario</text><rect x="430" y="1070" width="300" height="100" rx="4" fill="#f3edf9" stroke="#45657b" stroke-width="1.5" /><text x="442" y="1087" font-size="10" text-anchor="start" fill="#476273">PENDING</text><text x="580" y="1112" font-size="15" text-anchor="middle" fill="#19324b">Measured trials + baseline</text><text x="580" y="1132" font-size="15" text-anchor="middle" fill="#19324b">planned_n &gt;= 30; &gt;= 12 h</text><rect x="430" y="1250" width="300" height="100" rx="4" fill="#f3edf9" stroke="#45657b" stroke-width="1.5" /><text x="442" y="1267" font-size="10" text-anchor="start" fill="#476273">PENDING</text><text x="580" y="1292" font-size="15" text-anchor="middle" fill="#19324b">Human review</text><text x="580" y="1312" font-size="15" text-anchor="middle" fill="#19324b">and final thesis</text><text x="580" y="305" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">next stage</text><text x="580" y="485" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">next stage</text><text x="580" y="665" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">next stage</text><text x="580" y="845" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">next stage</text><text x="580" y="1025" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">next stage</text><text x="580" y="1205" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">next stage</text><text x="230" y="665" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">revise design after failed checks</text><text x="35" y="1435" font-size="13" text-anchor="start" fill="#486172">Code/design reference only | No native acceptance or measured results implied</text></svg>
