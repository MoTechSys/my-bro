<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1330" width="1160" height="1330" role="img" aria-labelledby="title description" font-family="DejaVu Sans Mono, monospace"><title id="title">DFD level 1 - collection, enrichment and storage</title><desc id="description">تفكيك DFD تشغيلي. الإثراء يعاد كحدث للتحليل، وسجل AR يعاد إلى الجمع ولا يثبت بمفرده t5. يشمل P6 النقل والفهرسة والاستعلام، ولا اتصال مباشر بين المخزن والمحلل دون عملية استعلام. Implemented contracts / design view; native acceptance pending</desc><rect width="1160" height="1330" fill="#ffffff" /><rect width="1160" height="124" fill="#102b45" /><text x="35" y="43" font-size="14" text-anchor="start" fill="#93d6dd">FIG04_DFD1</text><text x="35" y="76" font-size="22" text-anchor="start" fill="#ffffff">DFD level 1 - collection, enrichment and storage</text><text x="35" y="105" font-size="14" text-anchor="start" fill="#dbe8f3">Implemented contracts / design view; native acceptance pending</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#366581" /></marker></defs><polyline points="360,220 800,220" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="950,270 950,360" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="360,410 800,410" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="950,460 950,550" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="800,580 360,580" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="800,600 580,600 580,790 360,790" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="210,840 210,930" fill="none" stroke