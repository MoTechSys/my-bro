<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1512" width="1160" height="1512" role="img" aria-labelledby="title description" font-family="DejaVu Sans Mono, monospace"><title id="title">UC-03 - guarded Linux removal sequence</title><desc id="description">التسلسل المصحح لـLinux: قاعدة 87105 والمسار المعتمد، ثم check_keys ورد continue أو abort، ثم مقارنة MD5 وهوية الملف قبل os.unlink تحت واصف أب مثبت. لا rm -f. تبقى نافذة تبديل الاسم النهائية موثقة في SECURITY_REVIEW؛ سجل النجاح ليس شاهد t5 مستقلاً. Linux code path; failure/abort branches described, no measured timing</desc><rect width="1160" height="1512" fill="#ffffff" /><rect width="1160" height="124" fill="#102b45" /><text x="35" y="43" font-size="14" text-anchor="start" fill="#93d6dd">FIG06_VT_SEQUENCE</text><text x="35" y="76" font-size="22" text-anchor="start" fill="#ffffff">UC-03 - guarded Linux removal sequence</text><text x="35" y="105" font-size="14" text-anchor="start" fill="#dbe8f3">Linux code path; failure/abort branches described, no measured timing</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#366581" /></marker></defs><rect x="10" y="150" width="190" height="46" rx="6" fill="#eaf3ff" stroke="#45657b" /><text x="105" y="179" font-size="14" text-anchor="middle" fill="#19324b">Agent</text><line x1="105" x2="105" y1="196" y2="1442" stroke="#91a6b5" stroke-dasharray="5 5" /><rect x="200" y="150" width="190" height="46" rx="6" fill="#eaf3ff" stroke="#45657b" /><text x="295" y="179" font-size="14" text-anchor="middle" fill="#19324b">Manager</text><line x1="295" x2="295" y1="196" y2="1442" stroke="#91a6b5" stroke-dasharray="5 5" /><rect x="390" y="150" width="190" height="46" rx="6" fill="#eaf3ff" stroke="#45657b" /><text x="485" y="179" font-size="14" text-anchor="middle" fill="#19324b">VT integration</text><line x1="485" x2="485" y1="196" y2="1442" stroke="#91a6b5" stroke-dasharray="5 5" /><rect x="580" y="150" width="190" height="46" rx="6" fill="#eaf3ff" stroke="#45657b" /><text x="675" y="179" font-size="14" text-anchor="middle" fill="#19324b">execd / wrapper</text><line x1="675" x2="675" y1="196" y2="1442" stroke="#91a6b5" stroke-dasharray="5 5" /><rect x="770" y="150" width="190" height="46" rx="6" fill="#eaf3ff" stroke="#45657b" /><text x="865" y="179" font-size="14" text-anchor="middle" fill="#19324b">soc_ar remove</text><line x1="865" x2="865" y1="196" y2="1442" stroke="#91a6b5" stroke-dasharray="5 5" /><rect x="960" y="150" width="190" height="46" rx="6" fill="#eaf3ff" stroke="#45657b" /><text x="1055" y="179" font-size="14" text-anchor="middle" fill="#19324b">Filebeat / Indexer</text><line x1="1055" x2="1055" y1="196" y2="1442" stroke="#91a6b5" stroke-dasharray="5 5" /><rect x="20" y="215" width="1120" height="28" fill="#f7fafc" /><text x="580" y="234" font-size="14" text-anchor="middle" fill="#19324b">01. FIM event -&gt; configured 100200/100201 trigger</text><polyline points="105,255 295,255" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="303" width="1120" height="28" fill="#f7fafc" /><text x="580" y="322" font-size="14" text-anchor="middle" fill="#19324b">02. Hash reputation request through integration</text><polyline points="295,343 485,343" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="391" width="1120" height="28" fill="#f7fafc" /><text x="580" y="410" font-size="14" text-anchor="middle" fill="#19324b">03. Reputation event -&gt; rule 87105 when matched</text><polyline points="485,431 295,431" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="479" width="1120" height="28" fill="#f7fafc" /><text x="580" y="498" font-size="14" text-anchor="middle" fill="#19324b">04. Dispatch configured local remove-threat response</text><polyline points="295,519 675,519" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="567" width="1120" height="28" fill="#f7fafc" /><text x="580" y="586" font-size="14" text-anchor="middle" fill="#19324b">05. Read bounded JSON add; delete is a no-op</text><polyline points="675,607 865,607" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="655" width="1120" height="28" fill="#f7fafc" /><text x="580" y="674" font-size="14" text-anchor="middle" fill="#19324b">06. Require rule 87105 and approved path; derive agent/path/md5 keys</text><polyline points="865,690 910,690 910,714 865,714" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="743" width="1120" height="28" fill="#f7fafc" /><text x="580" y="762" font-size="14" text-anchor="middle" fill="#19324b">07. check_keys handshake</text><polyline points="865,783 675,783" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="831" width="1120" height="28" fill="#f7fafc" /><text x="580" y="850" font-size="14" text-anchor="middle" fill="#19324b">08. abort -&gt; return; continue -&gt; proceed; otherwise reject</text><polyline points="675,871 865,871" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="919" width="1120" height="28" fill="#f7fafc" /><text x="580" y="938" font-size="14" text-anchor="middle" fill="#19324b">09. Open no-follow single-link regular file under pinned parent</text><polyline points="865,954 910,954 910,978 865,978" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="1007" width="1120" height="28" fill="#f7fafc" /><text x="580" y="1026" font-size="14" text-anchor="middle" fill="#19324b">10. Compare source MD5 and stable descriptor/name identity</text><polyline points="865,1042 910,1042 910,1066 865,1066" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="1095" width="1120" height="28" fill="#f7fafc" /><text x="580" y="1114" font-size="14" text-anchor="middle" fill="#19324b">11. os.unlink(basename, dir_fd=parent); final name-swap risk remains</text><polyline points="865,1130 910,1130 910,1154 865,1154" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="1183" width="1120" height="28" fill="#f7fafc" /><text x="580" y="1202" font-size="14" text-anchor="middle" fill="#19324b">12. Write success/error log; log is not independent completion evidence</text><polyline points="865,1223 105,1223" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="1271" width="1120" height="28" fill="#f7fafc" /><text x="580" y="1290" font-size="14" text-anchor="middle" fill="#19324b">13. Recollect log; configured success/failure rules may match</text><polyline points="105,1311 295,1311" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="1359" width="1120" height="28" fill="#f7fafc" /><text x="580" y="1378" font-size="14" text-anchor="middle" fill="#19324b">14. alerts.json -&gt; Filebeat -&gt; Indexer -&gt; Dashboard</text><polyline points="295,1399 1055,1399" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><text x="35" y="1487" font-size="13" text-anchor="start" fill="#486172">Code/design reference only | No native acceptance or measured results implied</text></svg>
