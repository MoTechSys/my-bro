<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1248" width="1160" height="1248" role="img" aria-labelledby="title description" font-family="DejaVu Sans Mono, monospace"><title id="title">UC-07 - bounded Linux YARA scan sequence</title><desc id="description">فحص واصف ملف ثابت دون recursion أو shell. يتحقق الكود من المحفزات والمعاملات وثقة الملف التنفيذي والقواعد والمهلة وهوية الملف بعد الفحص. 108001 خاص بالمطابقة الإيجابية؛ scan_complete سجل تدقيق ذاتي لا شاهد سببي مستقل. Linux code path; failure/abort branches described, no measured timing</desc><rect width="1160" height="1248" fill="#ffffff" /><rect width="1160" height="124" fill="#102b45" /><text x="35" y="43" font-size="14" text-anchor="start" fill="#93d6dd">FIG07_YARA_SEQUENCE</text><text x="35" y="76" font-size="22" text-anchor="start" fill="#ffffff">UC-07 - bounded Linux YARA scan sequence</text><text x="35" y="105" font-size="14" text-anchor="start" fill="#dbe8f3">Linux code path; failure/abort branches described, no measured timing</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#366581" /></marker></defs><rect x="10" y="150" width="190" height="46" rx="6" fill="#eaf3ff" stroke="#45657b" /><text x="105" y="179" font-size="14" text-anchor="middle" fill="#19324b">Agent</text><line x1="105" x2="105" y1="196" y2="1178" stroke="#91a6b5" stroke-dasharray="5 5" /><rect x="247" y="150" width="190" height="46" rx="6" fill="#eaf3ff" stroke="#45657b" /><text x="342" y="179" font-size="14" text-anchor="middle" fill="#19324b">Manager</text><line x1="342" x2="342" y1="196" y2="1178" stroke="#91a6b5" stroke-dasharray="5 5" /><rect x="485" y="150" width="190" height="46" rx="6" fill="#eaf3ff" stroke="#45657b" /><text x="580" y="179" font-size="14" text-anchor="middle" fill="#19324b">soc_ar yara</text><line x1="580" x2="580" y1="196" y2="1178" stroke="#91a6b5" stroke-dasharray="5 5" /><rect x="722" y="150" width="190" height="46" rx="6" fill="#eaf3ff" stroke="#45657b" /><text x="817" y="179" font-size="14" text-anchor="middle" fill="#19324b">YARA process</text><line x1="817" x2="817" y1="196" y2="1178" stroke="#91a6b5" stroke-dasharray="5 5" /><rect x="960" y="150" width="190" height="46" rx="6" fill="#eaf3ff" stroke="#45657b" /><text x="1055" y="179" font-size="14" text-anchor="middle" fill="#19324b">Filebeat / Indexer</text><line x1="1055" x2="1055" y1="196" y2="1178" stroke="#91a6b5" stroke-dasharray="5 5" /><rect x="20" y="215" width="1120" height="28" fill="#f7fafc" /><text x="580" y="234" font-size="14" text-anchor="middle" fill="#19324b">01. FIM event -&gt; configured Linux trigger 100300 or 100301</text><polyline points="105,255 342,255" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="303" width="1120" height="28" fill="#f7fafc" /><text x="580" y="322" font-size="14" text-anchor="middle" fill="#19324b">02. AR add with exact approved extra_args; delete -&gt; no-op</text><polyline points="342,343 580,343" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="391" width="1120" height="28" fill="#f7fafc" /><text x="580" y="410" font-size="14" text-anchor="middle" fill="#19324b">03. Require allowed path; pin regular single-link file without following links</text><polyline points="580,426 625,426 625,450 580,450" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="479" width="1120" height="28" fill="#f7fafc" /><text x="580" y="498" font-size="14" text-anchor="middle" fill="#19324b">04. Wait for stable identity; reject if not stable within bounded loop</text><polyline points="580,514 625,514 625,538 580,538" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="567" width="1120" height="28" fill="#f7fafc" /><text x="580" y="586" font-size="14" text-anchor="middle" fill="#19324b">05. Check root-owned non-writable regular binary and rule file</text><polyline points="580,602 625,602 625,626 580,626" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="655" width="1120" height="28" fill="#f7fafc" /><text x="580" y="674" font-size="14" text-anchor="middle" fill="#19324b">06. yara -w -a 10 -l 100 RULES /proc/self/fd/FD; no shell or recursion</text><polyline points="580,695 817,695" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="743" width="1120" height="28" fill="#f7fafc" /><text x="580" y="762" font-size="14" text-anchor="middle" fill="#19324b">07. 25 s subprocess timeout; CPU/address-space limits; require exit 0</text><polyline points="817,783 580,783" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="831" width="1120" height="28" fill="#f7fafc" /><text x="580" y="850" font-size="14" text-anchor="middle" fill="#19324b">08. Recheck file identity; validate each rule name and descriptor output</text><polyline points="580,866 625,866 625,890 580,890" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="919" width="1120" height="28" fill="#f7fafc" /><text x="580" y="938" font-size="14" text-anchor="middle" fill="#19324b">09. Write match lines and scan_complete audit; failures logged separately</text><polyline points="580,959 105,959" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="1007" width="1120" height="28" fill="#f7fafc" /><text x="580" y="1026" font-size="14" text-anchor="middle" fill="#19324b">10. yara_decoder / 108001 for positive match, not every completed scan</text><polyline points="105,1047 342,1047" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="1095" width="1120" height="28" fill="#f7fafc" /><text x="580" y="1114" font-size="14" text-anchor="middle" fill="#19324b">11. alerts.json -&gt; Filebeat -&gt; Indexer -&gt; Dashboard</text><polyline points="342,1135 1055,1135" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><text x="35" y="1223" font-size="13" text-anchor="start" fill="#486172">Code/design reference only | No native acceptance or measured results implied</text></svg>
