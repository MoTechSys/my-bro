<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1180" width="1160" height="1180" role="img" aria-labelledby="title description" font-family="DejaVu Sans Mono, monospace"><title id="title">Actors, use cases and authority boundaries</title><desc id="description">خريطة فاعلين وحالات استخدام وليست مخطط صلاحيات RBAC منفذاً. المسؤول يضبط النشر؛ المشغّل يجري المحاكاة المصرح بها؛ المحلل يراجع؛ والمراجع البشري يوسم ويحكم مستقلاً. AI استشاري ولا يمتلك سلطة AR. UC-12/13 مقترحان وليسا قبولاً منفذاً. Implemented contracts / design view; native acceptance pending</desc><rect width="1160" height="1180" fill="#ffffff" /><rect width="1160" height="124" fill="#102b45" /><text x="35" y="43" font-size="14" text-anchor="start" fill="#93d6dd">FIG09_ACTORS</text><text x="35" y="76" font-size="22" text-anchor="start" fill="#ffffff">Actors, use cases and authority boundaries</text><text x="35" y="105" font-size="14" text-anchor="start" fill="#dbe8f3">Implemented contracts / design view; native acceptance pending</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#366581" /></marker></defs><polyline points="360,220 800,220" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="360,420 800,420" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="360,620 800,620" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="360,820 800,820" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="360,1020 800,1020" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><rect x="60" y="170" width="300" height="100" rx="4" fill="#fff4dc" stroke="#45657b" stroke-width="1.5" /><text x="72" y="187" font-size="10" text-anchor="start" fill="#476273">ACTOR</text><text x="210" y="212" font-size="15" text-anchor="middle" fill="#19324b">SOC administrator</text><text x="210" y="232" font-size="15" text-anchor="middle" fill="#19324b">Deployment / configuration</text><rect x="800" y="170" width="300" height="100" rx="22" fill="#eaf3ff" stroke="#45657b" stroke-width="1.5" /><text x="812" y="187" font-size="10" text-anchor="start" fill="#476273">PROCESS</text><text x="950" y="212" font-size="15" text-anchor="middle" fill="#19324b">UC-01</text><text x="950" y="232" font-size="15" text-anchor="middle" fill="#19324b">Agent enrollment / health</text><rect x="60" y="370" width="300" height="100" rx="4" fill="#fff4dc" stroke="#45657b" stroke-width="1.5" /><text x="72" y="387" font-size="10" text-anchor="start" fill="#476273">ACTOR</text><text x="210" y="412" font-size="15" text-anchor="middle" fill="#19324b">Authorized lab operator</text><text x="210" y="432" font-size="15" text-anchor="middle" fill="#19324b">Controlled test scenarios</text><rect x="800" y="370" width="300" height="100" rx="22" fill="#eaf3ff" stroke="#45657b" stroke-width="1.5" /><text x="812" y="387" font-size="10" text-anchor="start" fill="#476273">PROCESS</text><text x="950" y="412" font-size="15" text-anchor="middle" fill="#19324b">UC-02..09 / UC-11</text><text x="950" y="432" font-size="15" text-anchor="middle" fill="#19324b">Detection / configured AR</text><rect x="60" y="570" width="300" height="100" rx="4" fill="#fff4dc" stroke="#45657b" stroke-width="1.5" /><text x="72" y="587" font-size="10" text-anchor="start" fill="#476273">ACTOR</text><text x="210" y="612" font-size="15" text-anchor="middle" fill="#19324b">Security analyst</text><text x="210" y="632" font-size="15" text-anchor="middle" fill="#19324b">Investigates / reviews</text><rect x="800" y="570" width="300" height="100" rx="22" fill="#eaf3ff" stroke="#45657b" stroke-width="1.5" /><text x="812" y="587" font-size="10" text-anchor="start" fill="#476273">PROCESS</text><text x="950" y="612" font-size="15" text-anchor="middle" fill="#19324b">UC-10 / UC-14</text><text x="950" y="632" font-size="15" text-anchor="middle" fill="#19324b">Notifications / AI advice</text><rect x="60" y="770" width="300" height="100" rx="4" fill="#fff4dc" stroke="#45657b" stroke-width="1.5" /><text x="72" y="787" font-size="10" text-anchor="start" fill="#476273">ACTOR</text><text x="210" y="812" font-size="15" text-anchor="middle" fill="#19324b">Human evaluator</text><text x="210" y="832" font-size="15" text-anchor="middle" fill="#19324b">Labels / adjudication</text><rect x="800" y="770" width="300" height="100" rx="22" fill="#eaf3ff" stroke="#45657b" stroke-width="1.5" /><text x="812" y="787" font-size="10" text-anchor="start" fill="#476273">PROCESS</text><text x="950" y="812" font-size="15" text-anchor="middle" fill="#19324b">C4 evaluation</text><text x="950" y="832" font-size="15" text-anchor="middle" fill="#19324b">Frozen planned denominator</text><rect x="60" y="970" width="300" height="100" rx="4" fill="#f3edf9" stroke="#45657b" stroke-width="1.5" /><text x="72" y="987" font-size="10" text-anchor="start" fill="#476273">PENDING</text><text x="210" y="1012" font-size="15" text-anchor="middle" fill="#19324b">UC-12 / UC-13</text><text x="210" y="1032" font-size="15" text-anchor="middle" fill="#19324b">Network / mobile visibility</text><rect x="800" y="970" width="300" height="100" rx="4" fill="#f3edf9" stroke="#45657b" stroke-width="1.5" /><text x="812" y="987" font-size="10" text-anchor="start" fill="#476273">PENDING</text><text x="950" y="1012" font-size="15" text-anchor="middle" fill="#19324b">Scope + samples + acceptance</text><text x="950" y="1032" font-size="15" text-anchor="middle" fill="#19324b">Not implemented by drawing</text><text x="580" y="208" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">configure / inspect</text><text x="580" y="408" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">authorized experiments</text><text x="580" y="608" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">review, never model execution</text><text x="580" y="808" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">independent labels / reviews</text><text x="580" y="1008" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">requires separate work</text><text x="35" y="1155" font-size="13" text-anchor="start" fill="#486172">Code/design reference only | No native acceptance or measured results implied</text></svg>
