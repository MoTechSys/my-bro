<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1160" width="1160" height="1160" role="img" aria-labelledby="title description" font-family="DejaVu Sans Mono, monospace"><title id="title">UC-14 - advisory evidence and evaluation sequence</title><desc id="description">المدخلات المنقحة والمعرفة المثبتة تدخل مسار المحلل. gold وrubric لا يرسلان إلى النموذج. سجل intent يسبق العامل، ويحفظ الفشل/الرفض/الانقطاع ولا يعيد المحاولة خفية. التحقق من البايتات لا يثبت هوية النموذج أو استقلال البشر. لا سهم نحو AR. Advisory-only pipeline; original inference and human C4 acceptance pending</desc><rect width="1160" height="1160" fill="#ffffff" /><rect width="1160" height="124" fill="#102b45" /><text x="35" y="43" font-size="14" text-anchor="start" fill="#93d6dd">FIG10_AI_SEQUENCE</text><text x="35" y="76" font-size="22" text-anchor="start" fill="#ffffff">UC-14 - advisory evidence and evaluation sequence</text><text x="35" y="105" font-size="14" text-anchor="start" fill="#dbe8f3">Advisory-only pipeline; original inference and human C4 acceptance pending</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#366581" /></marker></defs><rect x="10" y="150" width="190" height="46" rx="6" fill="#eaf3ff" stroke="#45657b" /><text x="105" y="179" font-size="14" text-anchor="middle" fill="#19324b">Operator</text><line x1="105" x2="105" y1="196" y2="1090" stroke="#91a6b5" stroke-dasharray="5 5" /><rect x="200" y="150" width="190" height="46" rx="6" fill="#eaf3ff" stroke="#45657b" /><text x="295" y="179" font-size="14" text-anchor="middle" fill="#19324b">Runner / store</text><line x1="295" x2="295" y1="196" y2="1090" stroke="#91a6b5" stroke-dasharray="5 5" /><rect x="390" y="150" width="190" height="46" rx="6" fill="#eaf3ff" stroke="#45657b" /><text x="485" y="179" font-size="14" text-anchor="middle" fill="#19324b">Analyst worker</text><line x1="485" x2="485" y1="196" y2="1090" stroke="#91a6b5" stroke-dasharray="5 5" /><rect x="580" y="150" width="190" height="46" rx="6" fill="#eaf3ff" stroke="#45657b" /><text x="675" y="179" font-size="14" text-anchor="middle" fill="#19324b">Optional Ollama</text><line x1="675" x2="675" y1="196" y2="1090" stroke="#91a6b5" stroke-dasharray="5 5" /><rect x="770" y="150" width="190" height="46" rx="6" fill="#eaf3ff" stroke="#45657b" /><text x="865" y="179" font-size="14" text-anchor="middle" fill="#19324b">Human reviewer</text><line x1="865" x2="865" y1="196" y2="1090" stroke="#91a6b5" stroke-dasharray="5 5" /><rect x="960" y="150" width="190" height="46" rx="6" fill="#eaf3ff" stroke="#45657b" /><text x="1055" y="179" font-size="14" text-anchor="middle" fill="#19324b">Evaluator / report</text><line x1="1055" x2="1055" y1="196" y2="1090" stroke="#91a6b5" stroke-dasharray="5 5" /><rect x="20" y="215" width="1120" height="28" fill="#f7fafc" /><text x="580" y="234" font-size="14" text-anchor="middle" fill="#19324b">01. Prepare pinned batch, code/config identity and private evidence store</text><polyline points="105,255 295,255" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="303" width="1120" height="28" fill="#f7fafc" /><text x="580" y="322" font-size="14" text-anchor="middle" fill="#19324b">02. Persist intent before bounded worker launch</text><polyline points="295,338 340,338 340,362 295,362" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="391" width="1120" height="28" fill="#f7fafc" /><text x="580" y="410" font-size="14" text-anchor="middle" fill="#19324b">03. Sanitized input + pinned knowledge; no gold labels or rubric</text><polyline points="295,431 485,431" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="479" width="1120" height="28" fill="#f7fafc" /><text x="580" y="498" font-size="14" text-anchor="middle" fill="#19324b">04. Explicit opt-in loopback request; offline default does not infer</text><polyline points="485,519 675,519" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="567" width="1120" height="28" fill="#f7fafc" /><text x="580" y="586" font-size="14" text-anchor="middle" fill="#19324b">05. Advisory output; execution_authority=none</text><polyline points="675,607 485,607" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="655" width="1120" height="28" fill="#f7fafc" /><text x="580" y="674" font-size="14" text-anchor="middle" fill="#19324b">06. Validated output or explicit noncompleted status; no inference from refusal prose</text><polyline points="485,695 295,695" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="743" width="1120" height="28" fill="#f7fafc" /><text x="580" y="762" font-size="14" text-anchor="middle" fill="#19324b">07. Persist bounded artifacts and terminal; missing terminal is interrupted</text><polyline points="295,778 340,778 340,802 295,802" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="831" width="1120" height="28" fill="#f7fafc" /><text x="580" y="850" font-size="14" text-anchor="middle" fill="#19324b">08. Export with offline byte verification; keep full planned denominator</text><polyline points="295,871 1055,871" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="919" width="1120" height="28" fill="#f7fafc" /><text x="580" y="938" font-size="14" text-anchor="middle" fill="#19324b">09. Gold labels and output-hash-bound claim adjudication</text><polyline points="865,959 1055,959" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><rect x="20" y="1007" width="1120" height="28" fill="#f7fafc" /><text x="580" y="1026" font-size="14" text-anchor="middle" fill="#19324b">10. Private report; missing reviews are not zero unsupported claims</text><polyline points="1055,1047 105,1047" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" /><text x="35" y="1135" font-size="13" text-anchor="start" fill="#486172">Code/design reference only | No native acceptance or measured results implied</text></svg>
