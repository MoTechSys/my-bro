<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1040" width="1160" height="1040" role="img" aria-labelledby="title description" font-family="DejaVu Sans Mono, monospace"><title id="title">Measurement logical records - not SQL tables</title><desc id="description">نموذج علاقات منطقي لعقود JSON/JSONL، لا جداول SQL أو مفاتيح أجنبية ينفذها OpenSearch. run_id/trial_id هوية المحاولة؛ manifest يصف الساعات والتخطيط؛ التنبيهات تربط بالهوية والنافذة والمحددات؛ مخازن المراقبين تحفظ بايتات مستقلة. t4/t5 ما زالا عملاً محلياً. Implemented contracts / design view; native acceptance pending</desc><rect width="1160" height="1040" fill="#ffffff" /><rect width="1160" height="124" fill="#102b45" /><text x="35" y="43" font-size="14" text-anchor="start" fill="#93d6dd">FIG11_MEASUREMENT_MODEL</text><text x="35" y="76" font-size="22" text-anchor="start" fill="#ffffff">Measurement logical records - not SQL tables</text><text x="35" y="105" font-size="14" text-anchor="start" fill="#dbe8f3">Implemented contracts / design view; native acceptance pending</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#366581" /></marker></defs><polyline points="360,220 800,220" fill="none" stroke="#366581" stroke-width="2" marker-end="none" marker-start="none" /><polyline points="210,270 210,390" fill="none" stroke="#366581" stroke-width="2" marker-end="none" marker-start="none" /><polyline points="950,270 950,390" fill="none" stroke="#366581" stroke-width="2" marker-end="none" marker-start="none" /><polyline points="210,490 210,610" fill="none" stroke="#366581" stroke-width="2" marker-end="none" marker-start="none" /><polyline points="950,490 950,610" fill="none" stroke="#366581" stroke-width="2" marker-end="none" marker-start="none" /><polyline points="1100,220 1130,220 1130,880 1100,880" fill="none" stroke="#366581" stroke-width="2" marker-end="none" marker-start="none" /><polyline points="360,660 550,660 550,220 800,220" fill="none" stroke="#366581" stroke-width="2" marker-end="none" marker-start="none" /><polyline points="360,880 610,880 610,220 800,220" fill="none" stroke="#366581" stroke-width="2" marker-end="none" marker-start="none" /><rect x="60" y="170" width="300" height="100" rx="4" fill="#e8f7ef" stroke="#45657b" stroke-width="1.5" /><path d="M 68 178 V 262 M 352 178 V 262" fill="none" stroke="#45657b" /><text x="72" y="187" font-size="10" text-anchor="start" fill="#476273">STORE</text><text x="210" y="204" font-size="15" text-anchor="middle" fill="#19324b">Run manifest</text><text x="210" y="224" font-size="15" text-anchor="middle" fill="#19324b">run_id / devices / clock_map</text><text x="210" y="244" font-size="15" text-anchor="middle" fill="#19324b">Predeclared plan</text><rect x="800" y="170" width="300" height="100" rx="4" fill="#e8f7ef" stroke="#45657b" stroke-width="1.5" /><path d="M 808 178 V 262 M 1092 178 V 262" fill="none" stroke="#45657b" /><text x="812" y="187" font-size="10" text-anchor="start" fill="#476273">STORE</text><text x="950" y="204" font-size="15" text-anchor="middle" fill="#19324b">Attempt JSONL</text><text x="950" y="224" font-size="15" text-anchor="middle" fill="#19324b">run_id + trial_id</text><text x="950" y="244" font-size="15" text-anchor="middle" fill="#19324b">t0 / selectors / exclusions</text><rect x="60" y="390" width="300" height="100" rx="4" fill="#e8f7ef" stroke="#45657b" stroke-width="1.5" /><path d="M 68 398 V 482 M 352 398 V 482" fill="none" stroke="#45657b" /><text x="72" y="407" font-size="10" text-anchor="start" fill="#476273">STORE</text><text x="210" y="424" font-size="15" text-anchor="middle" fill="#19324b">Device clock records</text><text x="210" y="444" font-size="15" text-anchor="middle" fill="#19324b">clock_ref / offset</text><text x="210" y="464" font-size="15" text-anchor="middle" fill="#19324b">precision / uncertainty</text><rect x="800" y="390" width="300" height="100" rx="4" fill="#e8f7ef" stroke="#45657b" stroke-width="1.5" /><path d="M 808 398 V 482 M 1092 398 V 482" fill="none" stroke="#45657b" /><text x="812" y="407" font-size="10" text-anchor="start" fill="#476273">STORE</text><text x="950" y="424" font-size="15" text-anchor="middle" fill="#19324b">Original alert records</text><text x="950" y="444" font-size="15" text-anchor="middle" fill="#19324b">Identity + timestamp</text><text x="950" y="464" font-size="15" text-anchor="middle" fill="#19324b">Selected by trial contract</text><rect x="60" y="610" width="300" height="100" rx="4" fill="#e8f7ef" stroke="#45657b" stroke-width="1.5" /><path d="M 68 618 V 702 M 352 618 V 702" fill="none" stroke="#45657b" /><text x="72" y="627" font-size="10" text-anchor="start" fill="#476273">STORE</text><text x="210" y="644" font-size="15" text-anchor="middle" fill="#19324b">Source evidence store</text><text x="210" y="664" font-size="15" text-anchor="middle" fill="#19324b">intent / polls / snapshots</text><text x="210" y="684" font-size="15" text-anchor="middle" fill="#19324b">Bound spec + file hash</text><rect x="800" y="610" width="300" height="100" rx="4" fill="#e8f7ef" stroke="#45657b" stroke-width="1.5" /><path d="M 808 618 V 702 M 1092 618 V 702" fill="none" stroke="#45657b" /><text x="812" y="627" font-size="10" text-anchor="start" fill="#476273">STORE</text><text x="950" y="644" font-size="15" text-anchor="middle" fill="#19324b">Visibility evidence store</text><text x="950" y="664" font-size="15" text-anchor="middle" fill="#19324b">identity / responses / polls</text><text x="950" y="684" font-size="15" text-anchor="middle" fill="#19324b">Bound t2 -&gt; observed t3</text><rect x="60" y="830" width="300" height="100" rx="4" fill="#e8f7ef" stroke="#45657b" stroke-width="1.5" /><path d="M 68 838 V 922 M 352 838 V 922" fill="none" stroke="#45657b" /><text x="72" y="847" font-size="10" text-anchor="start" fill="#476273">STORE</text><text x="210" y="864" font-size="15" text-anchor="middle" fill="#19324b">Recovery snapshots</text><text x="210" y="884" font-size="15" text-anchor="middle" fill="#19324b">journal / pending / manifest</text><text x="210" y="904" font-size="15" text-anchor="middle" fill="#19324b">Prefix + canonical bindings</text><rect x="800" y="830" width="300" height="100" rx="4" fill="#e8f7ef" stroke="#45657b" stroke-width="1.5" /><path d="M 808 838 V 922 M 1092 838 V 922" fill="none" stroke="#45657b" /><text x="812" y="847" font-size="10" text-anchor="start" fill="#476273">STORE</text><text x="950" y="864" font-size="15" text-anchor="middle" fill="#19324b">Derived measurement report</text><text x="950" y="884" font-size="15" text-anchor="middle" fill="#19324b">All-attempt denominator</text><text x="950" y="904" font-size="15" text-anchor="middle" fill="#19324b">Null missing timestamps</text><text x="580" y="208" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">one run : many attempts</text><text x="210" y="325" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">one run : device map</text><text x="950" y="325" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">zero or more candidate alerts</text><text x="210" y="545" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">device / clock binding</text><text x="950" y="545" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">expected alert identity</text><text x="950" y="785" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">derived outcomes</text><text x="560" y="560" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">source_binding + verified export</text><text x="590" y="790" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">pending path + journal prefix</text><text x="35" y="1015" font-size="13" text-anchor="start" fill="#486172">Code/design reference only | No native acceptance or measured results implied</text></svg>
