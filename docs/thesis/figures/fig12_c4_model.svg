<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1040" width="1160" height="1040" role="img" aria-labelledby="title description" font-family="DejaVu Sans Mono, monospace"><title id="title">C4 logical entities and cardinalities</title><desc id="description">عقود C4 الفعلية: cases داخل manifest؛ لكل case صفر أو محاولة واحدة، ولكل completed attempt صفر أو مراجعة واحدة مربوطة ببصمة الجواب. batch_id يجمع حالات من نفس المدخلات؛ تكرار المصدر لا يصنع عينة مستقلة. provenance يتضمن rubric لكنه لا يرسل إلى النموذج. Implemented contracts / design view; native acceptance pending</desc><rect width="1160" height="1040" fill="#ffffff" /><rect width="1160" height="124" fill="#102b45" /><text x="35" y="43" font-size="14" text-anchor="start" fill="#93d6dd">FIG12_C4_MODEL</text><text x="35" y="76" font-size="22" text-anchor="start" fill="#ffffff">C4 logical entities and cardinalities</text><text x="35" y="105" font-size="14" text-anchor="start" fill="#dbe8f3">Implemented contracts / design view; native acceptance pending</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#366581" /></marker></defs><polyline points="360,220 800,220" fill="none" stroke="#366581" stroke-width="2" marker-end="none" marker-start="none" /><polyline points="800,220 580,220 580,440 360,440" fill="none" stroke="#366581" stroke-width="2" marker-end="none" marker-start="none" /><polyline points="950,270 950,390" fill="none" stroke="#366581" stroke-width="2" marker-end="none" marker-start="none" /><polyline points="950,490 950,610" fill="none" stroke="#366581" stroke-width="2" marker-end="none" marker-start="none" /><polyline points="800,660 360,660" fill="none" stroke="#366581" stroke-width="2" marker-end="none" marker-start="none" /><polyline points="1100,440 1130,440 1130,880 1100,880" fill="none" stroke="#366581" stroke-width="2" marker-end="none" marker-start="none" /><rect x="60" y="170" width="300" height="100" rx="4" fill="#e8f7ef" stroke="#45657b" stroke-width="1.5" /><path d="M 68 178 V 262 M 352 178 V 262" fill="none" stroke="#45657b" /><text x="72" y="187" font-size="10" text-anchor="start" fill="#476273">STORE</text><text x="210" y="204" font-size="15" text-anchor="middle" fill="#19324b">Evaluation manifest</text><text x="210" y="224" font-size="15" text-anchor="middle" fill="#19324b">evaluation_id / provenance</text><text x="210" y="244" font-size="15" text-anchor="middle" fill="#19324b">dataset_kind / declarations</text><rect x="800" y="170" width="300" height="100" rx="4" fill="#e8f7ef" stroke="#45657b" stroke-width="1.5" /><path d="M 808 178 V 262 M 1092 178 V 262" fill="none" stroke="#45657b" /><text x="812" y="187" font-size="10" text-anchor="start" fill="#476273">STORE</text><text x="950" y="204" font-size="15" text-anchor="middle" fill="#19324b">Case (planned)</text><text x="950" y="224" font-size="15" text-anchor="middle" fill="#19324b">case_id, batch_id, alert_ref</text><text x="950" y="244" font-size="15" text-anchor="middle" fill="#19324b">input_sha256 / gold</text><rect x="60" y="390" width="300" height="100" rx="4" fill="#e8f7ef" stroke="#45657b" stroke-width="1.5" /><path d="M 68 398 V 482 M 352 398 V 482" fill="none" stroke="#45657b" /><text x="72" y="407" font-size="10" text-anchor="start" fill="#476273">STORE</text><text x="210" y="424" font-size="15" text-anchor="middle" fill="#19324b">Batch grouping</text><text x="210" y="444" font-size="15" text-anchor="middle" fill="#19324b">batch_id -&gt; input_sha256</text><text x="210" y="464" font-size="15" text-anchor="middle" fill="#19324b">Many cases may share input</text><rect x="800" y="390" width="300" height="100" rx="4" fill="#e8f7ef" stroke="#45657b" stroke-width="1.5" /><path d="M 808 398 V 482 M 1092 398 V 482" fill="none" stroke="#45657b" /><text x="812" y="407" font-size="10" text-anchor="start" fill="#476273">STORE</text><text x="950" y="424" font-size="15" text-anchor="middle" fill="#19324b">Attempt (0..1 per case)</text><text x="950" y="444" font-size="15" text-anchor="middle" fill="#19324b">status / prediction</text><text x="950" y="464" font-size="15" text-anchor="middle" fill="#19324b">output_sha256 / latency</text><rect x="60" y="610" width="300" height="100" rx="4" fill="#e8f7ef" stroke="#45657b" stroke-width="1.5" /><path d="M 68 618 V 702 M 352 618 V 702" fill="none" stroke="#45657b" /><text x="72" y="627" font-size="10" text-anchor="start" fill="#476273">STORE</text><text x="210" y="644" font-size="15" text-anchor="middle" fill="#19324b">Review (0..1 completed case)</text><text x="210" y="664" font-size="15" text-anchor="middle" fill="#19324b">reviewer_ref / independent</text><text x="210" y="684" font-size="15" text-anchor="middle" fill="#19324b">claims / unsupported_claims</text><rect x="800" y="610" width="300" height="100" rx="4" fill="#e8f7ef" stroke="#45657b" stroke-width="1.5" /><path d="M 808 618 V 702 M 1092 618 V 702" fill="none" stroke="#45657b" /><text x="812" y="627" font-size="10" text-anchor="start" fill="#476273">STORE</text><text x="950" y="644" font-size="15" text-anchor="middle" fill="#19324b">Shared answer artifact</text><text x="950" y="664" font-size="15" text-anchor="middle" fill="#19324b">output_sha256</text><text x="950" y="684" font-size="15" text-anchor="middle" fill="#19324b">Runner verifies actual bytes</text><rect x="60" y="830" width="300" height="100" rx="4" fill="#f3edf9" stroke="#45657b" stroke-width="1.5" /><text x="72" y="847" font-size="10" text-anchor="start" fill="#476273">PENDING</text><text x="210" y="864" font-size="15" text-anchor="middle" fill="#19324b">Human / model declarations</text><text x="210" y="884" font-size="15" text-anchor="middle" fill="#19324b">Not authenticated by hashes</text><text x="210" y="904" font-size="15" text-anchor="middle" fill="#19324b">Original evaluation pending</text><rect x="800" y="830" width="300" height="100" rx="4" fill="#e8f7ef" stroke="#45657b" stroke-width="1.5" /><path d="M 808 838 V 922 M 1092 838 V 922" fill="none" stroke="#45657b" /><text x="812" y="847" font-size="10" text-anchor="start" fill="#476273">STORE</text><text x="950" y="864" font-size="15" text-anchor="middle" fill="#19324b">C4 report</text><text x="950" y="884" font-size="15" text-anchor="middle" fill="#19324b">All planned + conditional</text><text x="950" y="904" font-size="15" text-anchor="middle" fill="#19324b">Failure / missing included</text><text x="580" y="208" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">1 : 1..1000 planned cases</text><text x="580" y="324" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">grouping, not a SQL table</text><text x="950" y="325" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">1 : 0..1 recorded attempt</text><text x="950" y="545" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">hash binding</text><text x="580" y="648" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">completed + matching output hash</text><text x="950" y="785" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">status and prediction</text><text x="35" y="1015" font-size="13" text-anchor="start" fill="#486172">Code/design reference only | No native acceptance or measured results implied</text></svg>
