<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1040" width="1160" height="1040" role="img" aria-labelledby="title description" font-family="DejaVu Sans Mono, monospace"><title id="title">Storage zones and document model</title><desc id="description">Wazuh Indexer مخزن وثائق OpenSearch؛ id داخل التنبيه ليس افتراضاً أنه _id الفهرس. السجلات الخاصة وJSONL ليست قاعدة علائقية. مخازن الأدلة 0700 والملفات 0600 في أدوات الأدلة، ولا يعمم ذلك على كل ملفات Wazuh. Git يحوي كوداً وتصميماً لا أسراراً أو سجلات خام. Implemented contracts / design view; native acceptance pending</desc><rect width="1160" height="1040" fill="#ffffff" /><rect width="1160" height="124" fill="#102b45" /><text x="35" y="43" font-size="14" text-anchor="start" fill="#93d6dd">FIG13_STORAGE</text><text x="35" y="76" font-size="22" text-anchor="start" fill="#ffffff">Storage zones and document model</text><text x="35" y="105" font-size="14" text-anchor="start" fill="#dbe8f3">Implemented contracts / design view; native acceptance pending</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#366581" /></marker></defs><polyline points="360,220 800,220" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="950,270 950,390" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="950,490 950,610" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="210,710 210,830" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="360,880 800,880" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><rect x="60" y="170" width="300" height="100" rx="4" fill="#e8f7ef" stroke="#45657b" stroke-width="1.5" /><path d="M 68 178 V 262 M 352 178 V 262" fill="none" stroke="#45657b" /><text x="72" y="187" font-size="10" text-anchor="start" fill="#476273">STORE</text><text x="210" y="212" font-size="15" text-anchor="middle" fill="#19324b">Endpoint logs / events</text><text x="210" y="232" font-size="15" text-anchor="middle" fill="#19324b">Operational sensitive data</text><rect x="800" y="170" width="300" height="100" rx="4" fill="#e8f7ef" stroke="#45657b" stroke-width="1.5" /><path d="M 808 178 V 262 M 1092 178 V 262" fill="none" stroke="#45657b" /><text x="812" y="187" font-size="10" text-anchor="start" fill="#476273">STORE</text><text x="950" y="204" font-size="15" text-anchor="middle" fill="#19324b">Manager alerts.json</text><text x="950" y="224" font-size="15" text-anchor="middle" fill="#19324b">id / timestamp / rule / agent</text><text x="950" y="244" font-size="15" text-anchor="middle" fill="#19324b">syscheck or data fields</text><rect x="60" y="390" width="300" height="100" rx="4" fill="#e8f7ef" stroke="#45657b" stroke-width="1.5" /><path d="M 68 398 V 482 M 352 398 V 482" fill="none" stroke="#45657b" /><text x="72" y="407" font-size="10" text-anchor="start" fill="#476273">STORE</text><text x="210" y="424" font-size="15" text-anchor="middle" fill="#19324b">Git repository</text><text x="210" y="444" font-size="15" text-anchor="middle" fill="#19324b">Code / configs / diagrams</text><text x="210" y="464" font-size="15" text-anchor="middle" fill="#19324b">No raw logs or credentials</text><rect x="800" y="390" width="300" height="100" rx="4" fill="#e8f7ef" stroke="#45657b" stroke-width="1.5" /><path d="M 808 398 V 482 M 1092 398 V 482" fill="none" stroke="#45657b" /><text x="812" y="407" font-size="10" text-anchor="start" fill="#476273">STORE</text><text x="950" y="424" font-size="15" text-anchor="middle" fill="#19324b">Indexer document</text><text x="950" y="444" font-size="15" text-anchor="middle" fill="#19324b">_index / _id / _source</text><text x="950" y="464" font-size="15" text-anchor="middle" fill="#19324b">No SQL foreign keys</text><rect x="60" y="610" width="300" height="100" rx="4" fill="#e8f7ef" stroke="#45657b" stroke-width="1.5" /><path d="M 68 618 V 702 M 352 618 V 702" fill="none" stroke="#45657b" /><text x="72" y="627" font-size="10" text-anchor="start" fill="#476273">STORE</text><text x="210" y="644" font-size="15" text-anchor="middle" fill="#19324b">Private evidence directories</text><text x="210" y="664" font-size="15" text-anchor="middle" fill="#19324b">0700 directories / 0600 files</text><text x="210" y="684" font-size="15" text-anchor="middle" fill="#19324b">intent + snapshots + terminal</text><rect x="800" y="610" width="300" height="100" rx="22" fill="#eaf3ff" stroke="#45657b" stroke-width="1.5" /><text x="812" y="627" font-size="10" text-anchor="start" fill="#476273">PROCESS</text><text x="950" y="652" font-size="15" text-anchor="middle" fill="#19324b">Dashboard / query client</text><text x="950" y="672" font-size="15" text-anchor="middle" fill="#19324b">Searches indexed documents</text><rect x="60" y="830" width="300" height="100" rx="4" fill="#e8f7ef" stroke="#45657b" stroke-width="1.5" /><path d="M 68 838 V 922 M 352 838 V 922" fill="none" stroke="#45657b" /><text x="72" y="847" font-size="10" text-anchor="start" fill="#476273">STORE</text><text x="210" y="864" font-size="15" text-anchor="middle" fill="#19324b">Attempt journal JSONL</text><text x="210" y="884" font-size="15" text-anchor="middle" fill="#19324b">Separate from detection logs</text><text x="210" y="904" font-size="15" text-anchor="middle" fill="#19324b">Failures / exclusions kept</text><rect x="800" y="830" width="300" height="100" rx="4" fill="#e8f7ef" stroke="#45657b" stroke-width="1.5" /><path d="M 808 838 V 922 M 1092 838 V 922" fill="none" stroke="#45657b" /><text x="812" y="847" font-size="10" text-anchor="start" fill="#476273">STORE</text><text x="950" y="864" font-size="15" text-anchor="middle" fill="#19324b">Derived reports</text><text x="950" y="884" font-size="15" text-anchor="middle" fill="#19324b">Sanitized / access-controlled</text><text x="950" y="904" font-size="15" text-anchor="middle" fill="#19324b">Not authenticity certificates</text><text x="580" y="208" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">agent collection / analysis</text><text x="950" y="325" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">Filebeat</text><text x="950" y="545" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">query and presentation</text><text x="210" y="765" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">verified observation import</text><text x="580" y="868" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">offline calculation</text><text x="35" y="1015" font-size="13" text-anchor="start" fill="#486172">Code/design reference only | No native acceptance or measured results implied</text></svg>
