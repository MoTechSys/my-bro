<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1640" width="1160" height="1640" role="img" aria-labelledby="title description" font-family="DejaVu Sans Mono, monospace"><title id="title">Interrupted trial recovery activity</title><desc id="description">نشاط الاستعادة غير الهدامة. يفحص الربط والبادئة ويشتق سجلاً جديداً؛ الصف المنشور يحفظ مرة واحدة، والمنقطع لا يختلق له بدء أو خروج أو أزمنة مفقودة. أي رفض أو إخفاق يبقي الأدلة الأصلية؛ تصريح توقف المشغّل ليس إثبات موت العمليات. Design / workflow; not evidence that every stage has passed</desc><rect width="1160" height="1640" fill="#ffffff" /><rect width="1160" height="124" fill="#102b45" /><text x="35" y="43" font-size="14" text-anchor="start" fill="#93d6dd">FIG14_RECOVERY</text><text x="35" y="76" font-size="22" text-anchor="start" fill="#ffffff">Interrupted trial recovery activity</text><text x="35" y="105" font-size="14" text-anchor="start" fill="#dbe8f3">Design / workflow; not evidence that every stage has passed</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#366581" /></marker></defs><polyline points="580,270 580,350" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="580,450 580,530" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="580,630 580,710" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="580,810 580,890" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="580,990 580,1070" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="580,1170 580,1250" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="580,1350 580,1430" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><polyline points="730,760 970,760 970,1120 730,1120" fill="none" stroke="#366581" stroke-width="2" marker-end="url(#arrow)" marker-start="none" /><rect x="430" y="170" width="300" height="100" rx="4" fill="#fff4dc" stroke="#45657b" stroke-width="1.5" /><text x="442" y="187" font-size="10" text-anchor="start" fill="#476273">ACTOR</text><text x="580" y="212" font-size="15" text-anchor="middle" fill="#19324b">Operator stops collection</text><text x="580" y="232" font-size="15" text-anchor="middle" fill="#19324b">Pins original input hashes</text><rect x="430" y="350" width="300" height="100" rx="22" fill="#eaf3ff" stroke="#45657b" stroke-width="1.5" /><text x="442" y="367" font-size="10" text-anchor="start" fill="#476273">PROCESS</text><text x="580" y="392" font-size="15" text-anchor="middle" fill="#19324b">Lock original journal</text><text x="580" y="412" font-size="15" text-anchor="middle" fill="#19324b">Snapshot original bytes</text><rect x="430" y="530" width="300" height="100" rx="4" fill="#fff0e9" stroke="#45657b" stroke-width="1.5" /><text x="442" y="547" font-size="10" text-anchor="start" fill="#476273">DECISION</text><text x="580" y="572" font-size="15" text-anchor="middle" fill="#19324b">Validate manifest + pending</text><text x="580" y="592" font-size="15" text-anchor="middle" fill="#19324b">Journal path / prefix binding</text><rect x="430" y="710" width="300" height="100" rx="4" fill="#fff0e9" stroke="#45657b" stroke-width="1.5" /><text x="442" y="727" font-size="10" text-anchor="start" fill="#476273">DECISION</text><text x="580" y="752" font-size="15" text-anchor="middle" fill="#19324b">Existing final row?</text><text x="580" y="772" font-size="15" text-anchor="middle" fill="#19324b">Preserve once, never replace</text><rect x="430" y="890" width="300" height="100" rx="22" fill="#eaf3ff" stroke="#45657b" stroke-width="1.5" /><text x="442" y="907" font-size="10" text-anchor="start" fill="#476273">PROCESS</text><text x="580" y="932" font-size="15" text-anchor="middle" fill="#19324b">Otherwise append interrupted</text><text x="580" y="952" font-size="15" text-anchor="middle" fill="#19324b">Keep t0; no invented t1..t6</text><rect x="430" y="1070" width="300" height="100" rx="4" fill="#e8f7ef" stroke="#45657b" stroke-width="1.5" /><path d="M 438 1078 V 1162 M 722 1078 V 1162" fill="none" stroke="#45657b" /><text x="442" y="1087" font-size="10" text-anchor="start" fill="#476273">STORE</text><text x="580" y="1112" font-size="15" text-anchor="middle" fill="#19324b">Seal derived attempts.jsonl</text><text x="580" y="1132" font-size="15" text-anchor="middle" fill="#19324b">Original inputs unchanged</text><rect x="430" y="1250" width="300" height="100" rx="22" fill="#eaf3ff" stroke="#45657b" stroke-width="1.5" /><text x="442" y="1267" font-size="10" text-anchor="start" fill="#476273">PROCESS</text><text x="580" y="1292" font-size="15" text-anchor="middle" fill="#19324b">Offline export verification</text><text x="580" y="1312" font-size="15" text-anchor="middle" fill="#19324b">No command replay or alerts</text><rect x="430" y="1430" width="300" height="100" rx="4" fill="#e8f7ef" stroke="#45657b" stroke-width="1.5" /><path d="M 438 1438 V 1522 M 722 1438 V 1522" fill="none" stroke="#45657b" /><text x="442" y="1447" font-size="10" text-anchor="start" fill="#476273">STORE</text><text x="580" y="1472" font-size="15" text-anchor="middle" fill="#19324b">New continuation journal</text><text x="580" y="1492" font-size="15" text-anchor="middle" fill="#19324b">Exclusive private destination</text><text x="580" y="305" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">next stage</text><text x="580" y="485" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">next stage</text><text x="580" y="665" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">next stage</text><text x="580" y="845" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">no published final row</text><text x="580" y="1025" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">next stage</text><text x="580" y="1205" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">next stage</text><text x="580" y="1385" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">next stage</text><text x="895" y="930" font-size="13" text-anchor="middle" fill="#19324b" stroke="white" stroke-width="5" paint-order="stroke">existing final row: preserve once</text><text x="35" y="1615" font-size="13" text-anchor="start" fill="#486172">Code/design reference only | No native acceptance or measured results implied</text></svg>
