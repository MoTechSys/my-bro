<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1460" width="1160" height="1460" role="img" aria-labelledby="title description" font-family="DejaVu Sans Mono, monospace"><title id="title">Measurement timeline and evidence boundaries</title><desc id="description">خريطة تعريفات وليست محوراً زمنياً بمقياس أو رسماً لنتائج. event/action_confirmed من M2-A يثبت فعل الملف ولا يملأ t1. t2 وt6 من التنبيهات الأصلية، وt3 مراقب ظهور مستقل. t4/t5 غير منفذين بعد، ولا يثبت اختفاء الملف وحده سببية الحذف. Conceptual stages, NOT a guaranteed ordering of t3 versus AR stages</desc><rect width="1160" height="1460" fill="#ffffff" /><rect width="1160" height="124" fill="#102b45" /><text x="35" y="43" font-size="14" text-anchor="start" fill="#93d6dd">FIG15_TIMELINE</text><text x="35" y="76" font-size="22" text-anchor="start" fill="#ffffff">Measurement timeline and evidence boundaries</text><text x="35" y="105" font-size="14" text-anchor="start" fill="#dbe8f3">Conceptual stages, NOT a guaranteed ordering of t3 versus AR stages</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#366581" /></marker></defs><rect x="430" y="170" width="300" height="100" rx="22" fill="#eaf3ff" stroke="#45657b" stroke-width="1.5" /><text x="442" y="187" font-size="10" text-anchor="start" fill="#476273">PROCESS</text><text x="580" y="212" font-size="15" text-anchor="middle" fill="#19324b">t0: action launch intent</text><text x="580" y="232" font-size="15" text-anchor="middle" fill="#19324b">Durable trial journal</text><rect x="430" y="350" width="300" height="100" rx="22" fill="#eaf3ff" stroke="#45657b" stroke-width="1.5" /><text x="442" y="367" font-size="10" text-anchor="start" fill="#476273">PROCESS</text><text x="580" y="392" font-size="15" text-anchor="middle" fill="#19324b">t1: native source timestamp</text><text x="580" y="412" font-size="15" text-anchor="middle" fill="#19324b">Not poll time or file mtime</text><rect x="430" y="530" width="300" height="100" rx="22" fill="#eaf3ff" stroke="#45657b" stroke-width="1.5" /><text x="442" y="547" font-size="10" text-anchor="start" fill="#476273">PROCESS</text><text x="580" y="572" font-size="15" text-anchor="middle" fill="#19324b">t2: manager alert</text><text x="580" y="592" font-size="15" text-anchor="middle" fill="#19324b">UC-03 t2_prime separately</text><rect x="430" y="710" width="300" height="100" rx="22" fill="#eaf3ff" stroke="#45657b" stroke-width="1.5" /><text x="442" y="727" font-size="10" text-anchor="start" fill="#476273">PROCESS</text><text x="580" y="752" font-size="15" text-anchor="middle" fill="#19324b">t3: first observed visibility</text><text x="580" y="772" font-size="15" text-anchor="middle" fill="#19324b">Requires prior negative poll</text><rect x="430" y="890" width="300" height="100" rx="4" fill="#f3edf9" stroke="#45657b" stroke-width="1.5" /><text x="442" y="907" font-size="10" text-anchor="start" fill="#476273">PENDING</text><text x="580" y="932" font-size="15" text-anchor="middle" fill="#19324b">t4: actual AR start</text><text x="580" y="952" font-size="15" text-anchor="middle" fill="#19324b">Instrumentation not yet built</text><rect x="430" y="1070" width="300" height="100" rx="4" fill="#f3edf9" stroke="#45657b" stroke-width="1.5" /><text x="442" y="1087" font-size="10" text-anchor="start" fill="#476273">PENDING</text><text x="580" y="1112" font-size="15" text-anchor="middle" fill="#19324b">t5: independent completion</text><text x="580" y="1132" font-size="15" text-anchor="middle" fill="#19324b">Causal evidence not yet built</text><rect x="430" y="1250" width="300" height="100" rx="22" fill="#eaf3ff" stroke="#45657b" stroke-width="1.5" /><text x="442" y="1267" font-size="10" text-anchor="start" fill="#476273">PROCESS</text><text x="580" y="1292" font-size="15" text-anchor="middle" fill="#19324b">t6: manager confirmation</text><text x="580" y="1312" font-size="15" text-anchor="middle" fill="#19324b">Not proof of t5 by itself</text><text x="35" y="1435" font-size="13" text-anchor="start" fill="#486172">Code/design reference only | No native acceptance or measured results implied</text></svg>
