<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 980" width="1160" height="980" role="img" aria-labelledby="title description" font-family="DejaVu Sans Mono, monospace"><title id="title">Independent measurement stages and evidence types</title><desc id="description">خريطة تعريفات وليست محوراً زمنياً بمقياس أو رسماً لنتائج. event/action_confirmed من M2-A يثبت فعل الملف ولا يملأ t1. t2 وt6 من التنبيهات الأصلية، وt3 مراقب ظهور مستقل. t4/t5 غير منفذين بعد، ولا يثبت اختفاء الملف وحده سببية الحذف. Definition cards only - no time axis, durations or cross-lane ordering</desc><rect width="1160" height="980" fill="#ffffff" /><rect width="1160" height="124" fill="#102b45" /><text x="35" y="43" font-size="14" text-anchor="start" fill="#93d6dd">FIG15_TIMELINE</text><text x="35" y="76" font-size="22" text-anchor="start" fill="#ffffff">Independent measurement stages and evidence types</text><text x="35" y="105" font-size="14" text-anchor="start" fill="#dbe8f3">Definition cards only - no time axis, durations or cross-lane ordering</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#366581" /></marker></defs><rect x="60" y="170" width="300" height="100" rx="22" fill="#eaf3ff" stroke="#45657b" stroke-width="1.5" /><text x="72" y="187" font-size="10" text-anchor="start" fill="#476273">PROCESS</text><text x="210" y="212" font-size="15" text-anchor="middle" fill="#19324b">t0: action launch intent</text><text x="210" y="232" font-size="15" text-anchor="middle" fill="#19324b">Durable trial journal</text><rect x="800" y="170" width="300" height="100" rx="22" fill="#eaf3ff" stroke="#45657b" stroke-width="1.5" /><text x="812" y="187" font-size="10" text-anchor="start" fill="#476273">PROCESS</text><text x="950" y="212" font-size="15" text-anchor="middle" fill="#19324b">t1: native source timestamp</text><text x="950" y="232" font-size="15" text-anchor="middle" fill="#19324b">Not poll time or file mtime</text><rect x="60" y="370" width="300" height="100" rx="22" fill="#eaf3ff" stroke="#45657b" stroke-width="1.5" /><text x="72" y="387" font-size="10" text-anchor="start" fill="#476273">PROCESS</text><text x="210" y="412" font-size="15" text-anchor="middle" fill="#19324b">t2: manager alert</text><text x="210" y="432" font-size="15" text-anchor="middle" fill="#19324b">UC-03 t2_prime separately</text><rect x="800" y="370" width="300" height="100" rx="22" fill="#eaf3ff" stroke="#45657b" stroke-width="1.5" /><text x="812" y="387" font-size="10" text-anchor="start" fill="#476273">PROCESS</text><text x="950" y="412" font-size="15" text-anchor="middle" fill="#19324b">t3: first observed visibility</text><text x="950" y="432" font-size="15" text-anchor="middle" fill="#19324b">Requires prior negative poll</text><rect x="60" y="570" width="300" height="100" rx="4" fill="#f3edf9" stroke="#45657b" stroke-width="1.5" /><text x="72" y="587" font-size="10" text-anchor="start" fill="#476273">PENDING</text><text x="210" y="612" font-size="15" text-anchor="middle" fill="#19324b">t4: actual AR start</text><text x="210" y="632" font-size="15" text-anchor="middle" fill="#19324b">Instrumentation not yet built</text><rect x="800" y="570" width="300" height="100" rx="4" fill="#f3edf9" stroke="#45657b" stroke-width="1.5" /><text x="812" y="587" font-size="10" text-anchor="start" fill="#476273">PENDING</text><text x="950" y="612" font-size="15" text-anchor="middle" fill="#19324b">t5: independent completion</text><text x="950" y="632" font-size="15" text-anchor="middle" fill="#19324b">Causal evidence not yet built</text><rect x="60" y="770" width="300" height="100" rx="22" fill="#eaf3ff" stroke="#45657b" stroke-width="1.5" /><text x="72" y="787" font-size="10" text-anchor="start" fill="#476273">PROCESS</text><text x="210" y="812" font-size="15" text-anchor="middle" fill="#19324b">t6: manager confirmation</text><text x="210" y="832" font-size="15" text-anchor="middle" fill="#19324b">Not proof of t5 by itself</text><text x="35" y="955" font-size="13" text-anchor="start" fill="#486172">Code/design reference only | No native acceptance or measured results implied</text></svg>
